[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid


[program:php-fpm]
command=php-fpm -F

autostart=true
autorestart=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

startsecs=5
priority=1


[program:queue-worker]
command=php artisan queue:work --sleep=3 --tries=3 --timeout=120
directory=/var/www

autostart=true
autorestart=true

stopasgroup=true
killasgroup=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

startsecs=5
priority=2


[program:nginx]
command=nginx -g "daemon off;"

autostart=true
autorestart=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

startsecs=10
priority=3